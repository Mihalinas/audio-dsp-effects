[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-dsp-effects"
version = "0.1.0"
description = "Digital audio effects developed from a university thesis project"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
